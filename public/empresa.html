<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Panel de empresa · GasoCheck</title>
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto; }
    .emp { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 22px; }
    .emp-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .marca-prov { display: flex; align-items: center; gap: 12px; }
    .marca-prov img { flex: none; height: 48px; width: auto; }
    .emp h1 { margin: 0; font: 700 32px/1 var(--f-display); text-transform: uppercase; }
    .emp-cab p { margin: 4px 0 0; color: var(--texto-suave); }
    .emp h2 { margin: 0 0 10px; font: 600 13px/1.3 var(--f-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
    .tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .codigo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .codigo strong { font: 700 34px/1 var(--f-display); letter-spacing: .12em; padding: 8px 14px; border: 2px dashed var(--acento); border-radius: 10px; user-select: all; }
    .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .cifras div { padding: 12px; border-radius: 10px; background: var(--superficie-2); display: flex; flex-direction: column; gap: 2px; }
    .cifras span { font-size: 12px; color: var(--texto-suave); }
    .cifras strong { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
    .cifras .aviso-n strong { color: var(--caro); }
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; white-space: nowrap; }
    th { font-size: 12px; color: var(--texto-suave); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.wrap { white-space: normal; min-width: 220px; }
    tr.raro td { background: color-mix(in srgb, var(--caro) 6%, transparent); }
    .chip { display: inline-block; margin: 0 4px 4px 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: color-mix(in srgb, var(--caro) 16%, transparent); color: var(--caro); white-space: normal; }
    .chip.suave { background: var(--superficie-2); color: var(--texto-suave); }
    .form-veh { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
    .form-veh label, .filtro-mes label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--texto-suave); }
    .form-veh input, .form-veh select, .filtro-mes input { height: 42px; border: 1px solid var(--linea); border-radius: 8px; background: var(--fondo); padding: 0 10px; color: var(--texto); min-width: 0; }
    .filtro-mes { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .plan { padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--acento) 8%, var(--superficie)); font-size: 14px; }
    @media (max-width: 600px) { .emp h1 { font-size: 26px; } .codigo strong { font-size: 26px; } }
  </style>
</head>
<body>
  <main class="emp" id="emp"><p class="texto-ayuda">Cargando…</p></main>
  <div class="aviso" id="aviso" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="ojo.js"></script>
  <script src="empresa.js"></script>
</body>
</html>
