<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Viaje en directo · GasoCheck</title>
  <meta name="theme-color" content="#0b1424">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <style>
    :root { --fondo: #070e1a; --superficie: #0b1424; --linea: #1e2c45; --texto: #eef3fb; --suave: #8f9db5; --acento: #2f7bf6; --verde: #3ddc7e; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
    #mapa { position: fixed; inset: 0; background: #0f1a2d; }
    .leaflet-tile-pane { filter: brightness(.75) contrast(1.05) saturate(.8); }
    .tarjeta { position: fixed; z-index: 1000; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; padding: 14px 16px; border-radius: 16px; background: rgba(11, 20, 36, .95); border: 1px solid var(--linea); box-shadow: 0 8px 28px rgba(0,0,0,.45); }
    .tarjeta .cab { display: flex; align-items: center; gap: 10px; }
    .tarjeta img { width: 34px; height: 40px; }
    .tarjeta h1 { margin: 0; font-size: 17px; }
    .tarjeta p { margin: 4px 0 0; color: var(--suave); }
    .tarjeta .eta { margin-top: 10px; display: flex; gap: 18px; }
    .tarjeta .eta b { display: block; font-size: 22px; color: var(--verde); }
    .tarjeta .eta span { color: var(--suave); font-size: 13px; }
    .punto { width: 22px; height: 22px; border-radius: 50%; background: var(--acento); border: 4px solid #fff; box-shadow: 0 0 0 8px rgba(47,123,246,.3); }
    .meta { width: 26px; height: 26px; border-radius: 50%; background: #f04848; border: 3px solid #fff; display: grid; place-items: center; font-size: 13px; }
    a { color: #4d93ff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="mapa" aria-label="Mapa del viaje"></div>
  <section class="tarjeta" aria-live="polite">
    <div class="cab"><img src="img/logo.png" alt=""><div><h1 id="titulo">Cargando el viaje…</h1><p id="sub"></p></div></div>
    <div class="eta" id="eta" hidden><div><b id="hora"></b><span>llegada prevista</span></div><div><b id="resto"></b><span>le faltan</span></div></div>
    <p id="nota"></p>
  </section>
  <script src="vendor/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="viaje.js"></script>
</body>
</html>
