<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Panel de gasolinera · GasoCheck</title>
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto; }
    .prov { max-width: 960px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 22px; }
    .prov-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .marca-prov { display: flex; align-items: center; gap: 12px; }
    .marca-prov img { flex: none; height: 48px; width: auto; }
    .prov-cab h1 { margin: 0; font: 700 32px/1 var(--f-display); text-transform: uppercase; }
    .prov-cab p { margin: 4px 0 0; color: var(--texto-suave); }
    .prov h2 { margin: 0 0 10px; font: 600 13px/1.3 var(--f-texto); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
    .tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .tarjeta h3 { margin: 0; font: 700 24px/1.05 var(--f-display); text-transform: uppercase; }
    .tarjeta .dir { margin: 2px 0 0; color: var(--texto-suave); font-size: 14px; }
    .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .cifras div { padding: 10px 12px; border-radius: 10px; background: var(--superficie-2); display: flex; flex-direction: column; gap: 2px; }
    .cifras span { font-size: 12px; color: var(--texto-suave); }
    .cifras strong { font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
    .cifras .mal strong { color: var(--caro); }
    details > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
    .form-ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .form-ficha label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--texto-suave); min-width: 0; }
    .form-ficha input, .form-ficha textarea, .buscar-gas input { height: 42px; padding: 0 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--fondo); width: 100%; min-width: 0; color: var(--texto); }
    .form-ficha textarea, .resp textarea, .reclamar textarea { height: auto; min-height: 70px; padding: 8px 12px; resize: vertical; border: 1px solid var(--linea); border-radius: 8px; background: var(--fondo); width: 100%; color: var(--texto); }
    .form-ficha .ancho { grid-column: 1 / -1; }
    .servs { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; }
    .servs legend { font-size: 13px; color: var(--texto-suave); margin-bottom: 6px; padding: 0; }
    .servs label { flex-direction: row; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--linea); border-radius: 999px; color: var(--texto); background: var(--superficie); cursor: pointer; }
    .servs input { accent-color: var(--acento); }
    .vals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .vals li { padding: 12px; border-radius: 10px; background: var(--fondo); display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .vals .cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--texto-suave); font-size: 13px; }
    .vals .cab b { color: #f2b01e; letter-spacing: 1px; }
    .vals p { margin: 0; overflow-wrap: anywhere; }
    .resp { display: flex; flex-direction: column; gap: 6px; }
    .resp .boton { align-self: flex-start; min-height: 36px; }
    .estado { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--superficie-2); }
    .estado.aprobada { background: color-mix(in srgb, var(--barato) 20%, transparent); color: var(--barato); }
    .estado.rechazada, .estado.revocada { background: color-mix(in srgb, var(--caro) 18%, transparent); color: var(--caro); }
    .estado.pendiente { background: color-mix(in srgb, var(--medio) 20%, transparent); color: var(--medio); }
    .lista-rec { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .lista-rec li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--superficie); border: 1px solid var(--linea); font-size: 14px; flex-wrap: wrap; }
    .resultados { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .resultados li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--fondo); font-size: 14px; flex-wrap: wrap; }
    .resultados li > div { min-width: 0; }
    .reclamar { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--acento); }
    .entrar-prov { max-width: 420px; }
    .pro-caja { border-top: 1px solid var(--linea); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .sub-pro { margin: 6px 0 0; font-size: 14px; }
    .tabla-pro { overflow-x: auto; }
    .tabla-pro table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .tabla-pro th, .tabla-pro td { padding: 7px 8px; border-bottom: 1px solid var(--linea); text-align: left; white-space: nowrap; }
    .tabla-pro th { font-size: 12px; color: var(--texto-suave); }
    .tabla-pro .num { text-align: right; font-variant-numeric: tabular-nums; }
    .barras-vis { display: flex; align-items: flex-end; gap: 2px; height: 70px; padding: 4px; border-radius: 8px; background: var(--superficie-2); }
    .barras-vis i { flex: 1; background: var(--acento); border-radius: 2px 2px 0 0; min-height: 2px; }
    .nota-mes { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .nota-mes li { padding: 8px 10px; border-radius: 8px; background: var(--superficie-2); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; min-width: 64px; }
    .nota-mes b { font: 700 18px/1 var(--f-display); color: #e0a000; }
    .msg-pro { display: flex; flex-direction: column; gap: 8px; }
    .msg-pro textarea { min-height: 60px; padding: 8px 12px; border: 1px solid var(--linea); border-radius: 8px; background: var(--fondo); color: var(--texto); resize: vertical; }
    .pro-bloqueado { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--acento); background: color-mix(in srgb, var(--acento) 6%, transparent); }
    .pro-bloqueado ul { margin: 6px 0; padding-left: 18px; font-size: 14px; }
    .tabla-precios { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .tabla-precios [role="row"] { display: grid; grid-template-columns: 1.3fr .8fr 1fr .9fr; gap: 10px; align-items: center; font-size: 14px; }
    .tabla-precios .tp-cab { font-size: 12px; color: var(--texto-suave); }
    .tabla-precios .num { font-variant-numeric: tabular-nums; }
    .tabla-precios .ancho-fila { grid-column: 1 / -1; }
    .aviso-corr { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--medio) 18%, transparent); color: var(--texto); }
    .aviso-corr.fuerte { background: color-mix(in srgb, var(--caro) 18%, transparent); font-weight: 600; }
    .tabla-precios input { height: 38px; padding: 0 10px; border: 1px solid var(--linea); border-radius: 8px; background: var(--fondo); width: 100%; min-width: 0; color: var(--texto); font-variant-numeric: tabular-nums; }
    @media (max-width: 520px) { .tabla-precios [role="row"] { grid-template-columns: 1fr 1fr; } .tabla-precios .tp-cab { display: none; } }
    .vals .tags { margin: 0; color: var(--caro); font-size: 12px; }
    @media (max-width: 600px) { .form-ficha { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="prov" id="prov">
    <p class="texto-ayuda">Cargando…</p>
  </main>
  <div class="aviso" id="aviso" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="ojo.js"></script>
  <script src="proveedor.js"></script>
</body>
</html>
